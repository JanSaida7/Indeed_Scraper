<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scraper Dashboard</title>
    <meta name="description" content="A premium job scraping dashboard for Indeed listings.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-0 md:p-8 md:my-8 bg-white shadow-2xl rounded-2xl max-w-5xl overflow-hidden fade-in">
        <header class="text-center p-10 bg-slate-900 text-white mb-8 relative overflow-hidden">
            <div class="absolute inset-0 bg-blue-500 opacity-10 blur-3xl"></div>
            <h1 class="text-5xl font-extrabold tracking-tight mb-2 relative z-10">Job Scraper <span
                    class="text-blue-500">Pro</span></h1>
            <p class="text-slate-300 text-lg opacity-90 relative z-10">Find your next opportunity with ease.</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex justify-center mb-8 border-b border-gray-100 pb-4">
            <div class="bg-slate-100 p-1 rounded-full flex space-x-2">
                <button id="nav-scraper"
                    class="px-8 py-2 rounded-full font-semibold text-white bg-blue-600 shadow-md transition-all duration-300 focus:outline-none">Scraper</button>
                <button id="nav-database"
                    class="px-8 py-2 rounded-full font-semibold text-slate-500 hover:text-slate-700 transition-all duration-300 focus:outline-none">Database</button>
            </div>
        </div>

        <!-- Scraper Tab Content -->
        <div id="scraper-tab" class="p-6">
            <form id="scrape-form" class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div class="space-y-2">
                    <label for="keyword" class="text-sm font-semibold text-gray-700 tracking-wide">Job Keyword</label>
                    <div class="relative">
                        <input type="text" id="keyword" name="keyword"
                            class="w-full pl-4 pr-4 py-3 border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            placeholder="e.g., Salesforce Developer">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="location" class="text-sm font-semibold text-gray-700 tracking-wide">Location</label>
                    <input type="text" id="location" name="location"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="e.g., Hyderabad, Remote">
                </div>

                <div class="space-y-2">
                    <label for="maxItems" class="text-sm font-semibold text-gray-700 tracking-wide">Max Items</label>
                    <input type="number" id="maxItems" name="maxItems" value="10" min="1" max="100"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-gray-700 tracking-wide">Source</label>
                    <div
                        class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl text-gray-500 cursor-not-allowed">
                        Indeed
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="accessCode" class="text-sm font-semibold text-gray-700 tracking-wide">Access Code <span
                            class="text-red-500">*</span></label>
                    <input type="password" id="accessCode" name="accessCode" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="Enter Access Code">
                </div>


                <div class="col-span-1 md:col-span-2 pt-2">
                    <button type="submit" id="scrape-button"
                        class="w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transform transition hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Start Scraping Jobs
                    </button>
                </div>
            </form>

            <!-- Latest Results Preview -->
            <div id="latest-results-container" class="hidden mt-12 fade-in">
                <h3 class="text-2xl font-bold mb-6 text-gray-800 border-l-4 border-blue-600 pl-4">Latest Search
                    Results</h3>
                <div id="latest-results-body" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards will be injected here -->
                </div>
            </div>
        </div>

        <!-- Database Tab Content -->
        <div id="database-tab" class="hidden">
            <div class="flex justify-center space-x-4 mb-8">
                <button id="export-csv"
                    class="py-2 px-6 font-medium rounded-md text-white bg-green-600 hover:bg-green-700">Export
                    CSV</button>
                <button id="export-json"
                    class="py-2 px-6 font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700">Export
                    JSON</button>
            </div>

            <main class="mt-8 fade-in">
                <h2 class="text-2xl font-bold mb-6 text-gray-800 border-l-4 border-blue-600 pl-4">Current Jobs in
                    Database</h2>
                <div id="jobs-table-body" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards will be injected here -->
                </div>
            </main>

            <!-- Raw Data Toggle -->
            <div class="mt-4 text-right">
                <button id="toggle-debug"
                    class="text-xs text-gray-500 hover:text-gray-700 underline focus:outline-none">Show Raw Data
                    (Debug)</button>
            </div>
            <pre id="debug-view"
                class="hidden mt-2 p-4 bg-gray-900 text-green-400 rounded text-xs overflow-x-auto h-64"></pre>
        </div>

        <!-- Footer -->
        <footer class="mt-12 pt-8 border-t border-slate-100 text-center text-slate-400 text-sm pb-8">
            <p>&copy; 2026 Job Scraper Pro. Built with Flask & TailwindCSS.</p>
        </footer>

    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        const navScraper = document.getElementById('nav-scraper');
        const navDatabase = document.getElementById('nav-database');
        const scraperTab = document.getElementById('scraper-tab');
        const databaseTab = document.getElementById('database-tab');

        function switchTab(tab) {
            if (tab === 'scraper') {
                scraperTab.classList.remove('hidden');
                databaseTab.classList.add('hidden');

                navScraper.classList.add('bg-blue-600', 'text-white', 'shadow-md');
                navScraper.classList.remove('text-slate-500', 'hover:text-slate-700');

                navDatabase.classList.add('text-slate-500', 'hover:text-slate-700');
                navDatabase.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
            } else {
                scraperTab.classList.add('hidden');
                databaseTab.classList.remove('hidden');

                navDatabase.classList.add('bg-blue-600', 'text-white', 'shadow-md');
                navDatabase.classList.remove('text-slate-500', 'hover:text-slate-700');

                navScraper.classList.add('text-slate-500', 'hover:text-slate-700');
                navScraper.classList.remove('bg-blue-600', 'text-white', 'shadow-md');

                fetchAndDisplayJobs(); // Refresh data when switching to database view
            }
        }

        navScraper.addEventListener('click', () => switchTab('scraper'));
        navDatabase.addEventListener('click', () => switchTab('database'));

        // Function to fetch jobs and update the table
        async function fetchAndDisplayJobs() {
            try {
                console.log("Fetching jobs...");
                const response = await fetch('/api/jobs?t=' + new Date().getTime()); // Prevent caching
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const jobs = await response.json();
                console.log("Jobs received:", jobs);

                document.getElementById('debug-view').textContent = JSON.stringify(jobs, null, 2);

                const tableBody = document.getElementById('jobs-table-body');
                tableBody.innerHTML = ''; // Clear existing rows

                if (!Array.isArray(jobs) || jobs.length === 0) {
                    tableBody.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 text-lg">No jobs found in the database.</div>';
                } else {
                    jobs.forEach(job => {
                        const card = createJobCard(job);
                        tableBody.innerHTML += card;
                    });
                }
            } catch (error) {
                console.error("Error fetching jobs:", error);
                document.getElementById('jobs-table-body').innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-500">Error loading jobs: ${error.message}</td></tr>`;
            }
        }

        function createJobCard(job) {
            return `
                <div class="bg-white rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 p-6 border border-slate-100 flex flex-col justify-between h-full job-card group relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-500 transform scale-y-0 group-hover:scale-y-100 transition-transform duration-300"></div>
                    <div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2 leading-tight line-clamp-2 group-hover:text-blue-600 transition-colors" title="${job.job_title}">
                            ${job.job_title}
                        </h3>
                        <p class="text-blue-500 font-semibold text-sm mb-4 uppercase tracking-wide">${job.company_name}</p>
                        
                        <div class="space-y-3 text-sm text-slate-600 mb-6">
                            <div class="flex items-center">
                                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span class="font-medium">${job.location}</span>
                            </div>
                            <div class="flex items-center">
                                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <span class="font-medium">${job.post_date || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                    <a href="${job.job_url}" target="_blank" class="block w-full text-center py-3 px-4 bg-slate-50 hover:bg-blue-600 hover:text-white text-blue-600 font-bold rounded-lg transition-all border border-slate-200 hover:border-blue-600 mt-auto">
                        Apply Now &rarr;
                    </a>
                </div>
            `;
        }

        // --- Toast Notification Logic ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const icon = type === 'success' ? '✅' : '❌';

            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${icon}</div>
                <div class="text-sm font-medium text-gray-800">${message}</div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-out forwards';
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }, 3000);
        }

        // --- Event Listeners ---

        document.addEventListener('DOMContentLoaded', fetchAndDisplayJobs);

        document.getElementById('scrape-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const scrapeButton = document.getElementById('scrape-button');
            const originalButtonText = scrapeButton.innerHTML;

            scrapeButton.innerHTML = '<span class="spinner"></span> Scraping Jobs...';
            scrapeButton.disabled = true;
            scrapeButton.classList.add('opacity-75', 'cursor-not-allowed');

            const formData = {
                keyword: document.getElementById('keyword').value,
                location: document.getElementById('location').value,
                maxItems: document.getElementById('maxItems').value,
                accessCode: document.getElementById('accessCode').value
            };

            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();

                const resultsContainer = document.getElementById('latest-results-container');
                const resultsBody = document.getElementById('latest-results-body');

                resultsContainer.classList.add('hidden');

                if (result.status === 'success') {
                    showToast(result.message, 'success');

                    if (result.job_count > 0) {
                        try {
                            const latestJobsResponse = await fetch(`/api/jobs?limit=${result.job_count}&t=${new Date().getTime()}`);
                            const latestJobs = await latestJobsResponse.json();

                            resultsBody.innerHTML = '';
                            latestJobs.forEach(job => {
                                const card = createJobCard(job);
                                resultsBody.innerHTML += card;
                            });
                            resultsContainer.classList.remove('hidden');
                        } catch (e) {
                            console.error("Error fetching latest jobs:", e);
                        }
                    }
                } else {
                    showToast(`Error: ${result.message}`, 'error');
                }

                fetchAndDisplayJobs();

            } catch (error) {
                console.error("Error scraping:", error);
                showToast("An error occurred while scraping. Please try again.", 'error');
            } finally {
                scrapeButton.innerHTML = originalButtonText;
                scrapeButton.disabled = false;
                scrapeButton.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        document.getElementById('toggle-debug').addEventListener('click', () => {
            const debugView = document.getElementById('debug-view');
            debugView.classList.toggle('hidden');
            if (debugView.classList.contains('hidden')) {
                document.getElementById('toggle-debug').textContent = 'Show Raw Data (Debug)';
            } else {
                document.getElementById('toggle-debug').textContent = 'Hide Raw Data';
            }
        });

        document.getElementById('export-csv').addEventListener('click', async () => {
            window.location.href = '/api/export/csv';
        });

        document.getElementById('export-json').addEventListener('click', async () => {
            window.location.href = '/api/export/json';
        });
    </script>
</body>

</html>
